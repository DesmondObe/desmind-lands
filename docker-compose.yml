# Local infrastructure. Optional: `npm run dev:db` runs Postgres without Docker.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lands
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  pgdata:
