name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lands_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_SYSTEM_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lands_test
      TEST_DATABASE_URL: postgres://lands_api:lands_api@localhost:5432/lands_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx biome ci .
      - run: npm run typecheck
      - name: Migrate and create the API login role
        run: |
          npm run db:migrate --workspace @lands/backend
          psql "$TEST_SYSTEM_DATABASE_URL" -c "create role lands_api login password 'lands_api' in role lands_app"
        env:
          SYSTEM_DATABASE_URL: ${{ env.TEST_SYSTEM_DATABASE_URL }}
      - run: npm test
      - run: npm run build --workspace @lands/frontend
